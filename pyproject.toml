[project]
name = "tiny-llm"
version = "0.1.0"
description = "A tiny language model built one lesson at a time."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "pyrefly==1.4.1",
    "pytest==9.2.0",
]

[tool.uv]
required-version = ">=0.13.7"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.14"
preset = "strict"
check-unannotated-defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
